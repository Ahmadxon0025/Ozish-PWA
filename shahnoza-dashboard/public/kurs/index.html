    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

      // and sender identity (own child frame / direct parent) is checked

    const blobUrls = {};
    const resourceBlobs = {};

      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // ('__proto__', 'constructor') — an unshaped key would reach

        // Text is accepted only from the direct parent — the document

    setStatus('Unpacking ' + uuids.length + ' assets...');

        console.error('Failed to decode asset ' + uuid + ':', err);

    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);

    // DOMParser/replaceWith are inert per spec — re-create each with

    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

uncha.<\/div><\/div>\n      <div style=\"background:linear-gradient(180deg,#fdf3f6,#fff);border:1px solid #f6dfe8;border-radius:18px;padding:32px;text-align:center;\"><div style=\"font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:#d9578c;margin-bottom:12px;\">6 oy<\/div><div style=\"font-weight:700;font-size:15px;color:#43322c;margin-bottom:8px;\">\"O'z Markazim\" Kafolati<\/div><div style=\"font-size:14px;line-height:1.6;color:#6e5b53;\">Markaz ocha olmasa — +3 oy bepul mentorlik Shahnoza bilan.<\/div><\/div>\n    <\/div>\n    <div style=\"text-align:center;font-family:'Playfair Display',serif;font-size:24px;font-style:italic;color:#8d6a76;max-width:640px;margin:0 auto;line-height:1.5;\">\"Men sizdan bugun 'ha' yoki 'yo'q' deyishingizni so'ramayman. Men sizdan sinab ko'rishingizni so'rayman.\"<\/div>\n  <\/div>\n<\/div>\n\n<!-- 17 E'TIROZLAR -->\n<div style=\"background:linear-gradient(180deg,#fdf3f6,#fff);\">\n  <div style=\"max-width:1100px;margin:0 auto;padding:clamp(56px,8vw,90px) 24px;\">\n    <div style=\"text-align:center;margin-bottom:52px;\">\n      <div style=\"color:#ec87ac;font-size:13px;font-weight:700;letter-spacing:3px;margin-bottom:14px;\">BALKI SIZ O'YLAYAPSIZ...<\/div>\n      <h2 style=\"font-family:'Playfair Display',serif;font-size:clamp(28px,4.5vw,40px);font-weight:600;margin:0;color:#43322c;\">Bu savollar normaldi — <span style=\"color:#ec87ac;\">mana javoblar<\/span><\/h2>\n    <\/div>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;\">\n      <div style=\"background:#fff;border:1px solid #f6dfe8;border-radius:18px;padding:28px 30px;box-shadow:0 10px 30px rgba(190,120,150,.08);\"><div style=\"font-weight:700;font-size:16px;color:#d9578c;margin-bottom:10px;\">\"Tibbiy bilimim yo'q\"<\/div><div style=\"font-size:14px;line-height:1.65;color:#5c4a42;\">Shart emas. Shogirdlarimizning 80% tibbiy bilimsiz boshlagan. 0 dan professional darajagacha olib boramiz. Va 14 kun kafolat — mos kelmasa pulingiz qaytadi.<\/div><\/div>\n      <div style=\"background:#fff;border:1px solid #f6dfe8;border-radius:18px;padding:28px 30px;box-shadow:0 10px 30px rgba(190,120,150,.08);\"><div style=\"font-weight:700;font-size:16px;color:#d9578c;margin-bottom:10px;\">\"Vaqtim yo'q — bola, ish, uy\"<\/div><div style=\"font-size:14px;line-height:1.65;color:#5c4a42;\">Darslar 15 daqiqalik. Haftada 5 soat yetarli. Bola uxlayotganda, smenalar orasida. Telefondan ko'rasiz. 12 oy muddatingiz bor.<\/div><\/div>\n      <div style=\"background:#fff;border:1px solid #f6dfe8;border-radius:18px;padding:28px 30px;box-shadow:0 10px 30px rgba(190,120,150,.08);\"><div style=\"font-weight:700;font-size:16px;color:#d9578c;margin-bottom:10px;\">\"Pulim yo'q\"<\/div><div style=\"font-size:14px;line-height:1.65;color:#5c4a42;\">Uzum Nasiya — oyiga 125,000 so'mdan. Bir marta restoranga borish narxida. Birinchi oylik daromadingiz kursni qaytaradi.<\/div><\/div>\n      <div style=\"background:#fff;border:1px solid #f6dfe8;border-radius:18px;padding:28px 30px;box-shadow:0 10px 30px rgba(190,120,150,.08);\"><div style=\"font-weight:700;font-size:16px;color:#d9578c;margin-bottom:10px;\">\"Online kurs ishlamaydi\"<\/div><div style=\"font-size:14px;line-height:1.65;color:#5c4a42;\">Bu YouTube emas. Kurator har hafta sizning video amaliyotingizni tekshiradi. Shahnoza jonli Q&amp;A o'tkazadi. Xatoni OLDIDAN to'g'rilaymiz.<\/div><\/div>\n      <div style=\"background:#fff;border:1px solid #f6dfe8;border-radius:18px;padding:28px 30px;box-shadow:0 10px 30px rgba(190,120,150,.08);\"><div style=\"font-weight:700;font-size:16px;color:#d9578c;margin-bottom:10px;\">\"Aldab qo'yishlari mumkin\"<\/div><div style=\"font-size:14px;line-height:1.65;color:#5c4a42;\">14 kunlik 100% pul qaytarish. 17 yil tajriba, 30,000 bola. Risk BIZDA. Sizga faqat sinab ko'rish kerak.<\/div><\/div>\n      <div style=\"background:#fff;border:1px solid #f6dfe8;border-radius:18px;padding:28px 30px;box-shadow:0 10px 30px rgba(190,120,150,.08);\"><div style=\"font-weight:700;font-size:16px;color:#d9578c;margin-bottom:10px;\">\"Raqobatchilar arzonroq\"<\/div><div style=\"font-size:14px;line-height:1.65;color:#5c4a42;\">Guzal 3 mln so'raydi — modul yo'q, kurator yo'q, kafolat yo'q. Biz 3.5 mln uchun 12x ko'proq beramiz. Qiyoslang va qaror qiling.<\/div><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- 18 TESTIMONIALLAR #3 -->\n<div style=\"background:#fff;\">\n  <div style=\"max-width:1100px;margin:0 auto;padding:clamp(56px,8vw,90px) 24px;\">\n    <div style=\"text-align:center;margin-bottom:52px;\">\n      <div style=\"color:#ec87ac;font-size:13px;font-weight:700;letter-spacing:3px;margin-bottom:14px;\">ULAR HAM SHUBHALANGAN EDI<\/div>\n      <h2 style=\"font-family:'Playfair Display',serif;font-size:clamp(28px,4.5vw,40px);font-weight:600;margin:0;color:#43322c;\">Xuddi siz kabi <span style=\"color:#ec87ac;\">savollar bergan<\/span> edilar<\/h2>\n    <\/div>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;\">\n      <div style=\"background:linear-gradient(180deg,#fdf3f6,#fff);border:1px solid #f6dfe8;border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px;\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;\"><span style=\"font-size:12px;color:#8d7a72;\">55 yoshda<\/span><span style=\"background:#e8f5ec;color:#3a9d5d;font-weight:700;font-size:12px;padding:4px 12px;border-radius:999px;white-space:nowrap;\">0 → 15 mln/oy<\/span><\/div><div style=\"font-size:14.5px;line-height:1.6;color:#5c4a42;\">55 yoshda nabiralarining salomatligi uchun keldi. Endi o'z patsiyentlariga ega — uydan chiqmay oyiga 15 mln topib, farzand va nabiralariga yordam bermoqda.<\/div><div style=\"margin-top:auto;\"><div style=\"font-weight:700;font-size:14px;color:#43322c;\">Ra'no Ilhomova<\/div><div style=\"font-size:11.5px;color:#b3a49d;font-style:italic;\">*Shaxsiy natija — kafolatlanmaydi<\/div><\/div><\/div>\n      <div style=\"background:linear-gradient(180deg,#fdf3f6,#fff);border:1px solid #f6dfe8;border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px;\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;\"><span style=\"font-size:12px;color:#8d7a72;\">Sobiq sotuvchi<\/span><span style=\"background:#e8f5ec;color:#3a9d5d;font-weight:700;font-size:12px;padding:4px 12px;border-radius:999px;white-space:nowrap;\">→ 10 mln/oy<\/span><\/div><div style=\"font-size:14.5px;line-height:1.6;color:#5c4a42;\">Moddiy qiyinchilik sababli oziq-ovqat do'konida sotuvchi edi. Farzandlarini parvarish qilib natija ko'rdi, sharoitini yaxshiladi — oyiga 10 mln daromadga chiqdi.<\/div><div style=\"margin-top:auto;\"><div style=\"font-weight:700;font-size:14px;color:#43322c;\">Nazokat Abdullayeva<\/div><div style=\"font-size:11.5px;color:#b3a49d;font-style:italic;\">*Shaxsiy natija — kafolatlanmaydi<\/div><\/div><\/div>\n      <div style=\"background:linear-gradient(180deg,#fdf3f6,#fff);border:1px solid #f6dfe8;border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px;\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;\"><span style=\"font-size:12px;color:#8d7a72;\">19 yoshli talaba<\/span><span style=\"background:#e8f5ec;color:#3a9d5d;font-weight:700;font-size:12px;padding:4px 12px;border-radius:999px;white-space:nowrap;\">0 → 20 mln/oy<\/span><\/div><div style=\"font-size:14.5px;line-height:1.6;color:#5c4a42;\">19 yoshida bolajonlarni yaxshi ko'rgani uchun keldi. Endi oyiga 20 mln topib, oliygoh kontraktini va o'z ehtiyojlarini qoplab, oilasiga ham daromad kiritmoqda.<\/div><div style=\"margin-top:auto;\"><div style=\"font-weight:700;font-size:14px;color:#43322c;\">Nazokathon Sirojiddinova<\/div><div style=\"font-size:11.5px;color:#b3a49d;font-style:italic;\">*Shaxsiy natija — kafolatlanmaydi<\/div><\/div><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- 19 FAQ (dark) -->\n<div style=\"background:linear-gradient(160deg,#372832,#2a1e27);color:#fff;\">\n  <div style=\"max-width:1000px;margin:0 auto;padding:clamp(56px,8vw,90px) 24px;\">\n    <div style=\"text-align:center;margin-bottom:52px;\">\n      <div style=\"color:#f0a9c5;font-size:13px;font-weight:700;letter-spacing:3px;margin-bottom:14px;\">TEZ-TEZ SO'RALADIGAN SAVOLLAR<\/div>\n      <h2 style=\"font-family:'Playfair Display',serif;font-size:clamp(28px,4.5vw,40px);font-weight:600;margin:0;color:#fff;\">Amaliy <span style=\"color:#f0a9c5;\">savollar<\/span><\/h2>\n    <\/div>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;\">\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(240,169,197,.2);border-radius:16px;padding:24px 26px;\"><div style=\"font-weight:700;font-size:15px;color:#f0a9c5;margin-bottom:8px;\">Kurs qancha davom etadi?<\/div><div style=\"font-size:14px;line-height:1.6;opacity:.85;\">6 haftalik dastur + 12 oy video dostup. O'z tezligingizda o'rganing.<\/div><\/div>\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(240,169,197,.2);border-radius:16px;padding:24px 26px;\"><div style=\"font-weight:700;font-size:15px;color:#f0a9c5;margin-bottom:8px;\">Telefondan ko'rsa bo'ladimi?<\/div><div style=\"font-size:14px;line-height:1.6;opacity:.85;\">Ha. Barcha darslar telefondan ko'rish uchun moslangan. Yuklab olish mumkin.<\/div><\/div>\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(240,169,197,.2);border-radius:16px;padding:24px 26px;\"><div style=\"font-weight:700;font-size:15px;color:#f0a9c5;margin-bottom:8px;\">Kurs qaysi tilda?<\/div><div style=\"font-size:14px;line-height:1.6;opacity:.85;\">100% o'zbek tilida. Tibbiy terminlar ikki tilda beriladi.<\/div><\/div>\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(240,169,197,.2);border-radius:16px;padding:24px 26px;\"><div style=\"font-weight:700;font-size:15px;color:#f0a9c5;margin-bottom:8px;\">Sertifikat berasizmi?<\/div><div style=\"font-size:14px;line-height:1.6;opacity:.85;\">BAZA — kurs tugatish sertifikati. KASB va BIZNES — Shahnoza tasdiqlagan professional sertifikat.<\/div><\/div>\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(240,169,197,.2);border-radius:16px;padding:24px 26px;\"><div style=\"font-weight:700;font-size:15px;color:#f0a9c5;margin-bottom:8px;\">Qachon boshlansa bo'ladi?<\/div><div style=\"font-size:14px;line-height:1.6;opacity:.85;\">Keyingi guruh 15-sentabrda boshlanadi. O'rinlar soni cheklangan.<\/div><\/div>\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(240,169,197,.2);border-radius:16px;padding:24px 26px;\"><div style=\"font-weight:700;font-size:15px;color:#f0a9c5;margin-bottom:8px;\">Uzum Nasiya qanday ishlaydi?<\/div><div style=\"font-size:14px;line-height:1.6;opacity:.85;\">To'lovni 12 oyga bo'lasiz. Foizsiz. BAZA: 125K/oy, KASB: 292K/oy, BIZNES: 500K/oy.<\/div><\/div>\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(240,169,197,.2);border-radius:16px;padding:24px 26px;\"><div style=\"font-weight:700;font-size:15px;color:#f0a9c5;margin-bottom:8px;\">Internetim yomon — ishlayaptimi?<\/div><div style=\"font-size:14px;line-height:1.6;opacity:.85;\">Darslarni yuklab olish mumkin. Past sifat varianti ham bor.<\/div><\/div>\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(240,169,197,.2);border-radius:16px;padding:24px 26px;\"><div style=\"font-weight:700;font-size:15px;color:#f0a9c5;margin-bottom:8px;\">Agar o'rtada tashlab qo'ysam?<\/div><div style=\"font-size:14px;line-height:1.6;opacity:.85;\">12 oy muddatingiz bor. O'z tezligingizda. Kurator motivatsiya qiladi.<\/div><\/div>\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(240,169,197,.2);border-radius:16px;padding:24px 26px;\"><div style=\"font-weight:700;font-size:15px;color:#f0a9c5;margin-bottom:8px;\">Kimda amaliyot qilaman?<\/div><div style=\"font-size:14px;line-height:1.6;opacity:.85;\">O'z bolangizda, qo'shnining bolasida, yoki qo'g'irchoqda. Kurator video orqali tekshiradi.<\/div><\/div>\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(240,169,197,.2);border-radius:16px;padding:24px 26px;\"><div style=\"font-weight:700;font-size:15px;color:#f0a9c5;margin-bottom:8px;\">Yoshim o'tib ketganmi?<\/div><div style=\"font-size:14px;line-height:1.6;opacity:.85;\">Yosh chegarasi yo'q. 25-55 yoshgacha shogirdlarimiz bor.<\/div><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- 20 HARAKATSIZLIK NARXI -->\n<div style=\"background:#fff;\">\n  <div style=\"max-width:820px;margin:0 auto;padding:clamp(56px,8vw,90px) 24px;text-align:center;\">\n    <div style=\"color:#ec87ac;font-size:13px;font-weight:700;letter-spacing:3px;margin-bottom:14px;\">O'YLAB KO'RING<\/div>\n    <h2 style=\"font-family:'Playfair Display',serif;font-size:clamp(28px,4.5vw,40px);font-weight:600;margin:0 0 28px;color:#43322c;\">Agar hech narsa qilmasangiz <span style=\"color:#ec87ac;\">nima bo'ladi?<\/span><\/h2>\n    <p style=\"font-size:16px;line-height:1.75;color:#6e5b53;margin:0 0 20px;\">Yana 6 oy o'tadi. Maosh o'zgarmaydi. Bola kattaroq bo'ladi — va massaj oynasi yopiladi. O'zbekistonda 11 million bola bor, massajist deyarli yo'q — onalar hali ham izlamoqda. Lekin siz yo'qsiz.<\/p>\n    <p style=\"font-size:16px;line-height:1.75;color:#6e5b53;margin:0 0 28px;\">Shu payt kimdir — xuddi siz kabi — qaror qiladi va boshlaydi. 3 oydan keyin u mijozlarga ega. 6 oydan keyin u oyiga 5 mln topadi.<\/p>\n    <div style=\"font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:#d9578c;\">Farq — bitta qaror.<\/div>\n  <\/div>\n<\/div>\n\n<!-- 21 YAKUNIY NARX -->\n<div style=\"background:linear-gradient(180deg,#fdf3f6,#fbdce9);\">\n  <div style=\"max-width:820px;margin:0 auto;padding:clamp(56px,8vw,90px) 24px;text-align:center;\">\n    <div style=\"color:#d9578c;font-size:13px;font-weight:700;letter-spacing:3px;margin-bottom:14px;\">XULOSA<\/div>\n    <h2 style=\"font-family:'Playfair Display',serif;font-size:clamp(27px,4.5vw,38px);font-weight:600;margin:0 0 26px;color:#43322c;text-wrap:pretty;\">Siz olasiz: 22 modul + kurator + sertifikat + <span style=\"color:#d9578c;\">5 ta bonus<\/span><\/h2>\n    <div style=\"font-size:16px;color:#8d7a72;\">Jami qiymati <span style=\"text-decoration:line-through;\">18,900,000 so'm<\/span><\/div>\n    <div style=\"font-family:'Playfair Display',serif;font-size:clamp(38px,7vw,56px);font-weight:700;color:#d9578c;margin:12px 0 8px;\">3,500,000 so'm<\/div>\n    <div style=\"font-size:14px;color:#8d7a72;margin-bottom:20px;\">Uzum Nasiya: oyiga 292,000 so'm × 12 — restoranga borish narxida<\/div>\n    <div style=\"font-size:14px;line-height:1.65;color:#a4626f;font-style:italic;max-width:520px;margin:0 auto 32px;\">Ochig'i: agar \"tez boyish\" yo'lini izlayotgan bo'lsangiz yoki haftada 5 soat ajrata olmasangiz — yozilmang, pulingizni tejang. Bu kurs mehnat qilishga tayyor ayollar uchun.<\/div>\n    <button sc-camel-on-click=\"{{ openForm }}\" style=\"background:linear-gradient(135deg,#f6da8d,#e9b949 55%,#dda437);border:none;color:#fff;font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:2.5px;font-size:16px;padding:22px 60px;border-radius:14px;cursor:pointer;box-shadow:0 14px 34px rgba(222,167,58,.45);\">HOZIROQ YOZILISH<\/button>\n    <div style=\"font-size:13px;color:#a4626f;margin-top:16px;\">14 kun kafolat — mos kelmasa pulingiz 100% qaytadi<\/div>\n  <\/div>\n<\/div>\n\n<!-- 22 YAKUNIY CTA + P.S. -->\n<div style=\"background:linear-gradient(135deg,#f7b1cb,#e989b0);position:relative;overflow:hidden;\">\n  <div class=\"deco\" style=\"position:absolute;width:90px;height:90px;background:rgba(255,255,255,.35);border-radius:62% 38% 55% 45%/48% 62% 38% 52%;top:40px;left:8%;animation:floaty 8s ease-in-out infinite;\"><\/div>\n  <div class=\"deco\" style=\"position:absolute;width:60px;height:60px;background:rgba(255,255,255,.25);border-radius:55% 45% 62% 38%/52% 38% 62% 48%;bottom:50px;right:10%;animation:floaty 10s ease-in-out infinite;\"><\/div>\n  <div style=\"max-width:760px;margin:0 auto;padding:clamp(56px,8vw,90px) 24px;text-align:center;color:#fff;position:relative;\">\n    <h2 style=\"font-family:'Playfair Display',serif;font-size:clamp(30px,5vw,44px);font-weight:600;margin:0 0 20px;\">Birinchi qadamni tashlang<\/h2>\n    <p style=\"font-size:17px;line-height:1.7;margin:0 0 34px;opacity:.95;\">30,000+ bolaga yordam bergan mutaxassis sizga yo'l ko'rsatadi. 90 kunda yangi kasb. 14 kun kafolat. Sinab ko'ring.<\/p>\n    <button sc-camel-on-click=\"{{ openForm }}\" style=\"background:#fff;border:none;color:#d9578c;font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:2.5px;font-size:15px;padding:20px 52px;border-radius:14px;cursor:pointer;box-shadow:0 14px 34px rgba(120,30,70,.3);\">HOZIROQ YOZILISH<\/button>\n  <\/div>\n<\/div>\n<div style=\"background:#fff;\">\n  <div style=\"max-width:760px;margin:0 auto;padding:56px 32px 72px;text-align:center;\">\n    <p style=\"font-size:15px;line-height:1.75;color:#6e5b53;margin:0;\"><strong>P.S.<\/strong> Agar shu yergacha o'qigan bo'lsangiz — demak sizga kerak. Bitta savol: 3 oydan keyin siz qayerda bo'lasiz? Hozirgi joyingizda — yoki yangi kasbingiz, daromadingiz, va mustaqilligingiz bilan? Farq — bitta tugma. Va 14 kun ichida qaytarib olishingiz mumkin. <a href=\"#tariflar\" style=\"font-weight:700;\">Hoziroq boshlash →<\/a><\/p>\n  <\/div>\n<\/div>\n\n<!-- FOOTER DISCLAIMERLAR -->\n<div style=\"background:#faf7f5;border-top:1px solid #eee0d8;\">\n  <div style=\"max-width:860px;margin:0 auto;padding:36px 24px 48px;display:flex;flex-direction:column;gap:12px;\">\n    <p style=\"font-size:12px;line-height:1.6;color:#a89a92;margin:0;\"><strong>Daromad haqida:<\/strong> Daromad misollari — ayrim shogirdlarning shaxsiy natijalari, kafolat emas. Natija mehnatingiz, tajribangiz va bozorga bog'liq.<\/p>\n    <p style=\"font-size:12px;line-height:1.6;color:#a89a92;margin:0;\"><strong>Tibbiy izoh:<\/strong> Bolalar massaji — sog'ayishga yordam beruvchi qo'shimcha usul; shifokor ko'rigi va davolash o'rnini bosmaydi. Har doim pediatr bilan maslahatlashing.<\/p>\n    <div style=\"font-family:'Playfair Display',serif;font-size:14px;letter-spacing:2px;color:#8d7a72;margin-top:8px;text-align:center;\">SHAHNOZA AKADEMIYASI<\/div>\n  <\/div>\n<\/div>\n\n<div id=\"stickyCta\" style=\"position:fixed;bottom:0;left:0;right:0;z-index:90;background:#fff;box-shadow:0 -8px 24px rgba(120,30,70,.15);padding:10px 16px;display:flex;align-items:center;gap:12px;\">\n  <div style=\"flex:1;min-width:0;\"><div style=\"font-weight:700;font-size:13px;color:#43322c;\">Bolalar massaji kursi<\/div><div style=\"font-size:11px;color:#8d7a72;\">15-sentabr · {{ seatsLeft }} ta o'rin qoldi<\/div><\/div>\n  <button sc-camel-on-click=\"{{ openForm }}\" style=\"background:linear-gradient(135deg,#f6da8d,#e9b949 55%,#dda437);border:none;color:#fff;font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:1.5px;font-size:12px;padding:13px 22px;border-radius:12px;cursor:pointer;box-shadow:0 8px 20px rgba(222,167,58,.35);white-space:nowrap;\">YOZILISH<\/button>\n<\/div>\n\n<sc-if value=\"{{ formOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ closeForm }}\" style=\"position:fixed;inset:0;z-index:100;background:rgba(46,34,40,.55);display:flex;align-items:center;justify-content:center;padding:20px;\">\n  <div sc-camel-on-click=\"{{ stopProp }}\" style=\"background:#fff;border-radius:22px;padding:36px 32px;max-width:420px;width:100%;box-shadow:0 30px 80px rgba(60,20,40,.4);position:relative;\">\n    <div sc-camel-on-click=\"{{ closeForm }}\" style=\"position:absolute;top:14px;right:18px;font-size:22px;color:#b3a49d;cursor:pointer;line-height:1;\">×<\/div>\n    <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:#43322c;margin-bottom:6px;\">Kursga yozilish<\/div>\n      <div style=\"font-size:14px;color:#8d7a72;margin-bottom:6px;\">Tanlangan tarif: <strong style=\"color:#d9578c;\">{{ tariffName }}<\/strong><\/div>\n      <div style=\"font-size:13px;color:#8d7a72;line-height:1.5;margin-bottom:22px;\">Raqamingizni qoldiring — mutaxassisimiz tez orada qo'ng'iroq qilib, savollaringizga javob beradi.<\/div>\n      <div style=\"display:flex;flex-direction:column;gap:12px;\">\n        <input value=\"{{ leadName }}\" sc-camel-on-change=\"{{ setName }}\" placeholder=\"Ismingiz\" style=\"border:1.5px solid #f0d3de;border-radius:12px;padding:14px 16px;font-family:'Montserrat',sans-serif;font-size:15px;color:#43322c;outline:none;width:100%;\">\n        <input value=\"{{ leadPhone }}\" sc-camel-on-change=\"{{ setPhone }}\" placeholder=\"+998 __ ___ __ __\" type=\"tel\" style=\"border:1.5px solid #f0d3de;border-radius:12px;padding:14px 16px;font-family:'Montserrat',sans-serif;font-size:15px;color:#43322c;outline:none;width:100%;\">\n        <sc-if value=\"{{ phoneErr }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:#c0392b;\">Telefon raqamini to'liq kiriting<\/div><\/sc-if>\n        <button sc-camel-on-click=\"{{ submitLead }}\" style=\"background:linear-gradient(135deg,#f6da8d,#e9b949 55%,#dda437);border:none;color:#fff;font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:2px;font-size:14px;padding:17px;border-radius:12px;cursor:pointer;box-shadow:0 10px 24px rgba(222,167,58,.4);width:100%;\">QO'NG'IROQNI KUTAMAN<\/button>\n      <\/div>\n      <div style=\"font-size:11.5px;color:#b3a49d;margin-top:14px;text-align:center;\">Ma'lumotlaringiz hech kimga berilmaydi. 14 kun kafolat.<\/div>\n    <\/sc-if>\n    <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"text-align:center;padding:12px 0;\">\n        <div style=\"width:64px;height:64px;border-radius:50%;background:#fde4ee;color:#d9578c;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;\">✓<\/div>\n        <div style=\"font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:#43322c;margin-bottom:10px;\">Arizangiz qabul qilindi!<\/div>\n        <div style=\"font-size:14px;line-height:1.6;color:#6e5b53;\">Mutaxassisimiz tez orada <strong>{{ leadPhone }}<\/strong> raqamiga qo'ng'iroq qiladi.<\/div>\n      <\/div>\n    <\/sc-if>\n  <\/div>\n<\/div>\n<\/sc-if>\n\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;seatsTaken&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:18,&quot;min&quot;:0,&quot;max&quot;:30,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Urgency&quot;},&quot;seatsTotal&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;min&quot;:1,&quot;max&quot;:100,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Urgency&quot;},&quot;deadline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026-09-15&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Urgency&quot;}}\">\nclass Component extends DCLogic {\n  state = { now: Date.now(), formOpen: false, tariff: 'KASB', sent: false, leadName: '', leadPhone: '', phoneErr: false };\n  componentDidMount() {\n    this._t = setInterval(() => this.setState({ now: Date.now() }), 1000);\n    this._observed = new WeakSet();\n    const reduce = !('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (!reduce) {\n      this._io = new IntersectionObserver((entries) => {\n        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-in'); this._io.unobserve(e.target); } });\n      }, { threshold: 0.12 });\n    }\n    const scan = () => {\n      document.querySelectorAll('[data-reveal]').forEach(el => {\n        if (this._observed.has(el)) return;\n        this._observed.add(el);\n        if (reduce) el.classList.add('is-in'); else this._io.observe(el);\n      });\n    };\n    scan();\n    this._revealScan = setInterval(scan, 800);\n    setTimeout(() => clearInterval(this._revealScan), 8000);\n  }\n  componentWillUnmount() { clearInterval(this._t); }\n  getBonusTarget() {\n    if (this._bonusTarget) return this._bonusTarget;\n    const key = 'shahnoza_bonus_deadline_v1';\n    let t = 0;\n    try { t = parseInt(localStorage.getItem(key) || '0', 10); } catch (e) {}\n    if (!t || t < Date.now() - 86400000) {\n      t = Date.now() + 15 * 60 * 1000;\n      try { localStorage.setItem(key, String(t)); } catch (e) {}\n    }\n    this._bonusTarget = t;\n    return t;\n  }\n  renderVals() {\n    const deadline = this.props.deadline ?? '2026-09-15';\n    const target = new Date(deadline + 'T09:00:00').getTime();\n    const diff = Math.max(0, target - this.state.now);\n    const pad = (n) => String(n).padStart(2, '0');\n    const days = pad(Math.floor(diff / 86400000));\n    const hours = pad(Math.floor((diff % 86400000) / 3600000));\n    const mins = pad(Math.floor((diff % 3600000) / 60000));\n    const secs = pad(Math.floor((diff % 60000) / 1000));\n    const seats = this.props.seatsTaken ?? 18;\n    const total = this.props.seatsTotal ?? 30;\n    const bdiff = Math.max(0, this.getBonusTarget() - this.state.now);\n    const bonusTimer = pad(Math.floor(bdiff / 60000)) + ':' + pad(Math.floor((bdiff % 60000) / 1000));\n    return {\n      vtrue: true,\n      bonusTimer, bonusActive: bdiff > 0, bonusOver: bdiff <= 0,\n      days, hours, mins, secs, seats, total,\n      seatsLeft: Math.max(0, total - seats),\n      seatsPct: Math.min(100, Math.round(seats / total * 100)) + '%',\n      formOpen: this.state.formOpen, sent: this.state.sent, notSent: !this.state.sent,\n      tariffName: this.state.tariff, phoneErr: this.state.phoneErr,\n      leadName: this.state.leadName, leadPhone: this.state.leadPhone,\n      setName: (e) => this.setState({ leadName: e.target.value }),\n      setPhone: (e) => this.setState({ leadPhone: e.target.value }),\n      stopProp: (e) => e.stopPropagation(),\n      openForm: () => this.setState({ formOpen: true, sent: false, tariff: 'KASB' }),\n      openFormBaza: () => this.setState({ formOpen: true, sent: false, tariff: 'BAZA' }),\n      openFormKasb: () => this.setState({ formOpen: true, sent: false, tariff: 'KASB' }),\n      openFormBiznes: () => this.setState({ formOpen: true, sent: false, tariff: 'BIZNES' }),\n      closeForm: () => this.setState({ formOpen: false }),\n      submitLead: () => {\n        const digits = (this.state.leadPhone || '').replace(/\\D/g, '');\n        if (digits.length < 9) { this.setState({ phoneErr: true }); return; }\n        const lead = { name: this.state.leadName, phone: this.state.leadPhone, tariff: this.state.tariff, ts: new Date().toISOString() };\n        try {\n          const key = 'shahnoza_leads_v2';\n          const arr = JSON.parse(localStorage.getItem(key) || '[]');\n          arr.push(lead);\n          localStorage.setItem(key, JSON.stringify(arr));\n        } catch (e) {}\n        // CRM hookup: POST `lead` to your CRM endpoint here\n        this.setState({ sent: true, phoneErr: false });\n      }\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
